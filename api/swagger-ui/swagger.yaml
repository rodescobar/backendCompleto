openapi: 3.0.0
info:
  title: API de Administração de Loja Virtual
  version: 1.1.0
  description: |
    API REST para autenticação de usuários e administração de categorias,
    produtos e vendas de uma loja virtual.

servers:
  - url: http://localhost:3000
    description: Ambiente local
  - url: https://backend-completo.vercel.app
    description: Ambiente de produção

tags:
  - name: Usuários
  - name: Catálogo público
  - name: Categorias
  - name: Produtos
  - name: Vendas
  - name: Ambiente de testes

paths:
  /app/registrar:
    post:
      tags: [Usuários]
      summary: Registra um usuário administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
      responses:
        '201':
          description: Usuário registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ErroRequisicao'

  /app/login:
    post:
      tags: [Usuários]
      summary: Autentica um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: Token JWT válido por 24 horas
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'

  /app/perfil:
    get:
      tags: [Usuários]
      summary: Consulta o perfil do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '404':
          description: Usuário não encontrado

  /app/produtos/{usuario}:
    get:
      tags: [Catálogo público]
      summary: Lista produtos públicos de um usuário
      parameters:
        - $ref: '#/components/parameters/Usuario'
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/ErroRequisicao'

  /app/produtos/{usuario}/{nome_produto}:
    get:
      tags: [Catálogo público]
      summary: Busca produtos públicos pelo nome
      parameters:
        - $ref: '#/components/parameters/Usuario'
        - in: path
          name: nome_produto
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produtos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'

  /app/produtos:
    post:
      tags: [Produtos]
      summary: Cria um produto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoEntrada'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
    put:
      tags: [Produtos]
      summary: Atualiza um produto do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProdutoEntrada'
                - type: object
                  required: [id]
                  properties:
                    id:
                      type: string
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '404':
          description: Produto não encontrado
    delete:
      tags: [Produtos]
      summary: Exclui um produto do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        '200':
          description: Produto excluído
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '404':
          description: Produto não encontrado

  /app/categorias:
    get:
      tags: [Categorias]
      summary: Lista categorias do usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: nome_categoria
          schema:
            type: string
          description: Filtro opcional por nome
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
    post:
      tags: [Categorias]
      summary: Cria uma categoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome_categoria]
              properties:
                nome_categoria:
                  type: string
      responses:
        '200':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
    put:
      tags: [Categorias]
      summary: Atualiza uma categoria do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, nome_categoria]
              properties:
                id:
                  type: string
                nome_categoria:
                  type: string
      responses:
        '200':
          description: Categoria atualizada
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '404':
          description: Categoria não encontrada
    delete:
      tags: [Categorias]
      summary: Exclui uma categoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        '200':
          description: Categoria excluída
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'

  /app/venda:
    post:
      tags: [Vendas]
      summary: Registra uma venda para uma loja
      description: Rota pública utilizada pelo catálogo. O campo usuario identifica a loja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendaEntrada'
      responses:
        '201':
          description: Venda criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venda'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
    get:
      tags: [Vendas]
      summary: Lista vendas do usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: ID opcional de uma venda
      responses:
        '200':
          description: Lista de vendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venda'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
    delete:
      tags: [Vendas]
      summary: Exclui uma venda usando o ID no corpo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        '200':
          description: Venda excluída
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '404':
          description: Venda não encontrada

  /app/venda/{id}:
    delete:
      tags: [Vendas]
      summary: Exclui uma venda usando o ID na URL
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Venda excluída
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '404':
          description: Venda não encontrada

  /app/limpar:
    delete:
      tags: [Ambiente de testes]
      summary: Remove todos os dados do usuário autenticado
      description: Operação destrutiva destinada somente a testes controlados.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados removidos
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
    get:
      tags: [Ambiente de testes]
      summary: Compatibilidade da operação de limpeza antiga
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados removidos

components:
  parameters:
    Usuario:
      in: path
      name: usuario
      required: true
      schema:
        type: string
      description: Nome do usuário proprietário da loja
  responses:
    ErroRequisicao:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroAutenticacao:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        error:
          type: string
    Usuario:
      type: object
      properties:
        _id:
          type: string
        usuario:
          type: string
        createdAt:
          type: string
          format: date-time
    Registro:
      type: object
      required: [usuario, senha, confirma]
      properties:
        usuario:
          type: string
          example: aluno01
        senha:
          type: string
          format: password
          example: senha123
        confirma:
          type: string
          format: password
          example: senha123
    Login:
      type: object
      required: [usuario, senha]
      properties:
        usuario:
          type: string
        senha:
          type: string
          format: password
    Categoria:
      type: object
      properties:
        _id:
          type: string
        usuario:
          type: string
        nome:
          type: string
    ProdutoEntrada:
      type: object
      required: [nome, quantidade, preco, descricao, imagem, categoria]
      properties:
        nome:
          type: string
        quantidade:
          type: number
          minimum: 0
        preco:
          type: number
          minimum: 0
        descricao:
          type: string
        imagem:
          type: string
          format: uri
        categoria:
          type: string
    Produto:
      allOf:
        - $ref: '#/components/schemas/ProdutoEntrada'
        - type: object
          properties:
            _id:
              type: string
            usuario:
              type: string
    VendaEntrada:
      type: object
      required: [nomeCliente, data, produtos, usuario]
      properties:
        nomeCliente:
          type: string
        data:
          type: string
          format: date-time
        usuario:
          type: string
        produtos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemVenda'
    Venda:
      allOf:
        - $ref: '#/components/schemas/VendaEntrada'
        - type: object
          properties:
            _id:
              type: string
    ItemVenda:
      type: object
      required: [nome, quantidade, preco]
      properties:
        nome:
          type: string
        quantidade:
          type: number
          minimum: 1
        preco:
          type: number
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
